    <script>
      // BLOCK WEBASSEMBLY IMMEDIATELY
      (function() {
        'use strict';
        
        // Nuclear option: Make WebAssembly completely unavailable
        Object.defineProperty(window, 'WebAssembly', {
          get: function() {
            return undefined;
          },
          set: function() {},
          configurable: false,
          enumerable: false
        });
        
        // Block WASM file fetches
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
          const url = String(args[0] || '');
          if (url.includes('.wasm')) {
            console.log('🚫 Blocked WASM file');
            return Promise.reject(new Error('WASM blocked'));
          }
          return originalFetch.apply(this, args);
        };
        
        // Suppress ALL WebAssembly errors completely
        window.addEventListener('error', function(e) {
          const msg = String(e.message || e.error || '');
          if (msg.toLowerCase().includes('webassembly') || 
              msg.toLowerCase().includes('wasm')) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            console.clear();
            return false;
          }
        }, true);
        
        window.addEventListener('unhandledrejection', function(e) {
          const reason = String(e.reason || '');
          if (reason.toLowerCase().includes('webassembly') || 
              reason.toLowerCase().includes('wasm')) {
            e.preventDefault();
            e.stopPropagation();
            console.clear();
            return false;
          }
        }, true);
        
      })();
    </script>
