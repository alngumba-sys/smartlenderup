<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=http://localhost:5174">
    <title>Redirecting to Port 5174...</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a202c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .box {
            background: #2d3748;
            padding: 40px;
            border-radius: 10px;
            max-width: 500px;
        }
        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        .spinner {
            border: 4px solid #4a5568;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🚀</h1>
        <div class="spinner"></div>
        <p>Redirecting to <strong>localhost:5174</strong>...</p>
        <p style="font-size: 14px; opacity: 0.7; margin-top: 20px;">
            If you're not redirected, <a href="http://localhost:5174" style="color: #667eea;">click here</a>
        </p>
    </div>
</body>
</html>
