<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BV Funguo Microfinance Platform</title>
    
    <!-- NUCLEAR CACHE BUSTING -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <script>
      // STEP 1: Clear ALL storage
      (function() {
        'use strict';
        try {
          // Clear service workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for(let registration of registrations) {
                registration.unregister();
              }
            });
          }
          
          // Clear all caches
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) {
                caches.delete(name);
              }
            });
          }
          
          console.log('✅ All browser caches cleared');
        } catch (e) {
          console.warn('Could not clear all caches:', e);
        }
      })();
    </script>
    
    <script>
      // STEP 2: Block WebAssembly
      (function() {
        'use strict';
        const originalWebAssembly = window.WebAssembly;
        Object.defineProperty(window, 'WebAssembly', {
          get: function() {
            console.warn('🚫 WebAssembly access blocked');
            return undefined;
          },
          set: function() {},
          configurable: false
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
