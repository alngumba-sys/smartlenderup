<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache Diagnostic</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
        }
        h2 {
            color: #00ffff;
        }
        .error {
            color: #ff0000;
        }
        .success {
            color: #00ff00;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00ffff;
        }
    </style>
</head>
<body>
    <h1>🔍 WebAssembly Error Diagnostic</h1>
    
    <div class="section">
        <h2>Step 1: Check WebAssembly</h2>
        <div id="wasm-status"></div>
    </div>
    
    <div class="section">
        <h2>Step 2: Check Browser Cache</h2>
        <div id="cache-status"></div>
    </div>
    
    <div class="section">
        <h2>Step 3: Nuclear Fix</h2>
        <button onclick="nuclearFix()">🔥 CLEAR EVERYTHING NOW</button>
        <div id="fix-status"></div>
    </div>
    
    <div class="section">
        <h2>Step 4: Launch App</h2>
        <button onclick="launchApp()">🚀 START FRESH APP</button>
    </div>

    <script>
        // Check WebAssembly
        const wasmDiv = document.getElementById('wasm-status');
        if (typeof WebAssembly !== 'undefined') {
            wasmDiv.innerHTML = '<span class="error">❌ WebAssembly is ENABLED (this causes the error)</span>';
        } else {
            wasmDiv.innerHTML = '<span class="success">✅ WebAssembly is BLOCKED</span>';
        }
        
        // Check caches
        async function checkCaches() {
            const cacheDiv = document.getElementById('cache-status');
            let html = '';
            
            try {
                const cacheNames = await caches.keys();
                if (cacheNames.length > 0) {
                    html += '<span class="error">❌ Found ' + cacheNames.length + ' cached items:</span><br>';
                    cacheNames.forEach(name => {
                        html += '&nbsp;&nbsp;• ' + name + '<br>';
                    });
                } else {
                    html += '<span class="success">✅ No caches found</span><br>';
                }
            } catch (e) {
                html += '<span>Cache API check failed: ' + e.message + '</span><br>';
            }
            
            // Check localStorage
            const localStorageCount = localStorage.length;
            if (localStorageCount > 0) {
                html += '<span class="error">❌ localStorage has ' + localStorageCount + ' items</span><br>';
            } else {
                html += '<span class="success">✅ localStorage is empty</span><br>';
            }
            
            // Check sessionStorage
            const sessionStorageCount = sessionStorage.length;
            if (sessionStorageCount > 0) {
                html += '<span class="error">❌ sessionStorage has ' + sessionStorageCount + ' items</span><br>';
            } else {
                html += '<span class="success">✅ sessionStorage is empty</span><br>';
            }
            
            cacheDiv.innerHTML = html;
        }
        
        checkCaches();
        
        // Nuclear fix
        async function nuclearFix() {
            const fixDiv = document.getElementById('fix-status');
            fixDiv.innerHTML = '<span class="success">🔥 Clearing everything...</span><br>';
            
            // Clear localStorage
            try {
                localStorage.clear();
                fixDiv.innerHTML += '<span class="success">✅ Cleared localStorage</span><br>';
            } catch (e) {
                fixDiv.innerHTML += '<span class="error">❌ Failed to clear localStorage</span><br>';
            }
            
            // Clear sessionStorage
            try {
                sessionStorage.clear();
                fixDiv.innerHTML += '<span class="success">✅ Cleared sessionStorage</span><br>';
            } catch (e) {
                fixDiv.innerHTML += '<span class="error">❌ Failed to clear sessionStorage</span><br>';
            }
            
            // Clear cookies
            try {
                document.cookie.split(";").forEach(function(c) { 
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
                });
                fixDiv.innerHTML += '<span class="success">✅ Cleared cookies</span><br>';
            } catch (e) {
                fixDiv.innerHTML += '<span class="error">❌ Failed to clear cookies</span><br>';
            }
            
            // Clear caches
            try {
                const cacheNames = await caches.keys();
                for (let name of cacheNames) {
                    await caches.delete(name);
                }
                fixDiv.innerHTML += '<span class="success">✅ Cleared ' + cacheNames.length + ' caches</span><br>';
            } catch (e) {
                fixDiv.innerHTML += '<span class="error">❌ Failed to clear caches</span><br>';
            }
            
            // Unregister service workers
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                    fixDiv.innerHTML += '<span class="success">✅ Unregistered ' + registrations.length + ' service workers</span><br>';
                }
            } catch (e) {
                fixDiv.innerHTML += '<span class="error">❌ Failed to unregister service workers</span><br>';
            }
            
            fixDiv.innerHTML += '<br><span class="success">✅ DONE! Click "START FRESH APP" below</span>';
            
            // Re-check caches
            setTimeout(checkCaches, 500);
        }
        
        // Launch app
        function launchApp() {
            // Use completely unique URL with timestamp
            const uniqueUrl = '/fresh-start.html?v=' + Date.now() + '_' + Math.random().toString(36).substring(7);
            window.location.href = uniqueUrl;
        }
    </script>
</body>
</html>
