<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WASM Test - BV Funguo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin: 0 0 10px 0;
    }
    .subtitle {
      color: #666;
      margin: 0 0 30px 0;
    }
    .test {
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      border-left: 5px solid #ccc;
    }
    .pass {
      background: #d4edda;
      border-left-color: #28a745;
      color: #155724;
    }
    .fail {
      background: #f8d7da;
      border-left-color: #dc3545;
      color: #721c24;
    }
    .test-name {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }
    .test-detail {
      font-size: 14px;
      opacity: 0.8;
    }
    .summary {
      margin-top: 30px;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    .code {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin: 15px 0;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔬 WebAssembly Detection Test</h1>
    <p class="subtitle">Testing if your browser can load WebAssembly modules</p>
    
    <div id="results"></div>
    
    <div class="code">
      <strong>Test Environment:</strong><br>
      Browser: <span id="browser"></span><br>
      URL: <span id="url"></span><br>
      Date: <span id="date"></span>
    </div>
  </div>
  
  <script>
    const results = document.getElementById('results');
    
    // Show environment info
    document.getElementById('browser').textContent = navigator.userAgent;
    document.getElementById('url').textContent = window.location.href;
    document.getElementById('date').textContent = new Date().toLocaleString();
    
    function addTest(name, passed, details) {
      const div = document.createElement('div');
      div.className = `test ${passed ? 'pass' : 'fail'}`;
      div.innerHTML = `
        <div class="test-name">${passed ? '✅' : '❌'} ${name}</div>
        <div class="test-detail">${details}</div>
      `;
      results.appendChild(div);
      return passed;
    }
    
    let passCount = 0;
    let totalTests = 5;
    
    // Test 1: Check if WebAssembly exists
    if (addTest(
      'Test 1: WebAssembly Undefined',
      typeof WebAssembly === 'undefined',
      typeof WebAssembly === 'undefined' 
        ? 'Perfect! WebAssembly does not exist in window object.' 
        : 'WARNING: WebAssembly still exists! This means index.html blocking did not work.'
    )) passCount++;
    
    // Test 2: Try to access WebAssembly.Module
    let test2 = false;
    try {
      if (typeof WebAssembly === 'undefined' || typeof WebAssembly.Module === 'undefined') {
        test2 = true;
      }
    } catch (e) {
      test2 = true;
    }
    if (addTest(
      'Test 2: WebAssembly.Module Blocked',
      test2,
      test2 
        ? 'Perfect! Cannot access WebAssembly.Module.' 
        : 'WARNING: WebAssembly.Module is accessible!'
    )) passCount++;
    
    // Test 3: Check XLSX flags
    if (addTest(
      'Test 3: XLSX Flags Set',
      window.XLSX_NO_WASM === true && window.DISABLE_WASM === true,
      window.XLSX_NO_WASM === true && window.DISABLE_WASM === true
        ? 'Perfect! XLSX_NO_WASM and DISABLE_WASM flags are set to true.'
        : 'WARNING: Flags not set! XLSX might try to use WASM.'
    )) passCount++;
    
    // Test 4: Try to create WASM module (should fail)
    let test4 = false;
    try {
      if (typeof WebAssembly !== 'undefined' && WebAssembly.Module) {
        const bytes = new Uint8Array([0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00]);
        new WebAssembly.Module(bytes);
        test4 = false; // Should not reach here
      } else {
        test4 = true; // Good, WASM doesn't exist
      }
    } catch (e) {
      test4 = true; // Good, error thrown
    }
    if (addTest(
      'Test 4: Cannot Create WASM Module',
      test4,
      test4
        ? 'Perfect! Attempting to create a WASM module fails or is blocked.'
        : 'WARNING: WASM module creation succeeded!'
    )) passCount++;
    
    // Test 5: Check if fetch is overridden
    const fetchStr = window.fetch.toString();
    const test5 = fetchStr.includes('wasm') || fetchStr !== 'function fetch() { [native code] }';
    if (addTest(
      'Test 5: Fetch Override Active',
      test5,
      test5
        ? 'Perfect! fetch() has been overridden to block .wasm files.'
        : 'INFO: fetch() is not overridden, but this is OK if WASM is already deleted.'
    )) passCount++;
    
    // Summary
    const summary = document.createElement('div');
    summary.className = `summary ${passCount === totalTests ? 'pass' : 'fail'}`;
    summary.innerHTML = `
      ${passCount === totalTests ? '🎉 ALL TESTS PASSED!' : '⚠️ SOME TESTS FAILED'}<br>
      <div style="font-size: 16px; margin-top: 10px; opacity: 0.9;">
        ${passCount} out of ${totalTests} tests passed
      </div>
      <div style="font-size: 14px; margin-top: 15px; font-weight: normal;">
        ${passCount === totalTests 
          ? 'WebAssembly is completely blocked. Your app will NOT have WASM errors!' 
          : 'Some WASM protections may not be active. Check console for details.'}
      </div>
    `;
    results.appendChild(summary);
    
    // Console output
    console.log('═══════════════════════════════════════════════════════════════');
    console.log('🔬 WASM TEST RESULTS');
    console.log('═══════════════════════════════════════════════════════════════');
    console.log('WebAssembly exists:', typeof WebAssembly !== 'undefined');
    console.log('XLSX_NO_WASM flag:', window.XLSX_NO_WASM);
    console.log('DISABLE_WASM flag:', window.DISABLE_WASM);
    console.log('Tests passed:', passCount + '/' + totalTests);
    console.log('═══════════════════════════════════════════════════════════════');
    
    // If all tests passed, show success message
    if (passCount === totalTests) {
      console.log('%c✅ ALL PROTECTIONS ACTIVE - NO WASM ERRORS WILL OCCUR!', 'color: green; font-weight: bold; font-size: 16px;');
    } else {
      console.log('%c⚠️ SOME PROTECTIONS MISSING - WASM ERRORS MAY OCCUR', 'color: orange; font-weight: bold; font-size: 16px;');
    }
  </script>
</body>
</html>
