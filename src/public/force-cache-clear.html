<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clearing Cache...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 {
      color: #667eea;
      margin: 0 0 20px 0;
    }
    .spinner {
      width: 50px;
      height: 50px;
      margin: 20px auto;
      border: 4px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      color: #2d3748;
      font-size: 18px;
      margin: 20px 0;
    }
    .success {
      color: #38a169;
      font-weight: bold;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 Clearing Browser Cache</h1>
    <div class="spinner"></div>
    <div class="status" id="status">Please wait...</div>
    <button id="continue" style="display: none;">Continue to App</button>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const continueBtn = document.getElementById('continue');

    async function clearCache() {
      statusEl.textContent = 'Unregistering service workers...';
      
      // Unregister all service workers
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let registration of registrations) {
          await registration.unregister();
          console.log('✅ Unregistered service worker');
        }
      }
      
      await sleep(500);
      statusEl.textContent = 'Clearing cache storage...';
      
      // Clear all caches
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        for (let cacheName of cacheNames) {
          await caches.delete(cacheName);
          console.log('✅ Deleted cache:', cacheName);
        }
      }
      
      await sleep(500);
      statusEl.textContent = 'Clearing local storage...';
      
      // Clear localStorage (except organization data)
      const orgData = localStorage.getItem('organizationId');
      const orgName = localStorage.getItem('organizationName');
      localStorage.clear();
      if (orgData) localStorage.setItem('organizationId', orgData);
      if (orgName) localStorage.setItem('organizationName', orgName);
      
      await sleep(500);
      statusEl.textContent = 'Clearing session storage...';
      sessionStorage.clear();
      
      await sleep(500);
      statusEl.innerHTML = '<span class="success">✅ Cache cleared successfully!</span>';
      
      continueBtn.style.display = 'inline-block';
      continueBtn.onclick = () => {
        window.location.href = '/';
      };
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Auto-start clearing
    clearCache().catch(err => {
      statusEl.innerHTML = '<span style="color: #e53e3e;">❌ Error: ' + err.message + '</span>';
      continueBtn.style.display = 'inline-block';
      continueBtn.textContent = 'Try Anyway';
      continueBtn.onclick = () => window.location.href = '/';
    });
  </script>
</body>
</html>
