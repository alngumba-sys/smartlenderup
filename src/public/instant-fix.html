<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Fix - WebAssembly Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 60px;
            max-width: 700px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #e53e3e;
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 900;
        }
        
        .subtitle {
            color: #2d3748;
            font-size: 22px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .big-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 25px 60px;
            border-radius: 16px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            margin: 20px 0;
        }
        
        .big-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        
        .big-button:active {
            transform: translateY(0);
        }
        
        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            display: none;
        }
        
        .status.working {
            background: #fef5e7;
            color: #f6ad55;
            border: 2px solid #f6ad55;
            display: block;
        }
        
        .status.success {
            background: #f0fff4;
            color: #38a169;
            border: 2px solid #38a169;
            display: block;
        }
        
        .progress {
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar.active {
            display: block;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        
        .alternative {
            margin-top: 40px;
            padding: 25px;
            background: #edf2f7;
            border-radius: 12px;
        }
        
        .alternative h3 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .alternative p {
            color: #4a5568;
            line-height: 1.8;
            font-size: 16px;
        }
        
        code {
            background: #fff5f5;
            padding: 3px 8px;
            border-radius: 4px;
            color: #c53030;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Instant Fix</h1>
        <p class="subtitle">
            Click the button below to clear your browser cache<br>
            and eliminate the WebAssembly error forever.
        </p>
        
        <button class="big-button" onclick="fixNow()">
            🚀 FIX IT NOW
        </button>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="alternative">
            <h3>⚡ Even Faster Alternative</h3>
            <p>
                Press <code>Ctrl+Shift+N</code> (Windows) or <code>Cmd+Shift+N</code> (Mac)<br>
                Then visit: <code>http://localhost:5174</code><br>
                <strong>Incognito mode = No cache = No error!</strong>
            </p>
        </div>
    </div>
    
    <script>
        async function fixNow() {
            const statusDiv = document.getElementById('status');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            // Show progress
            progressBar.classList.add('active');
            statusDiv.className = 'status working';
            statusDiv.textContent = '🔄 Clearing cache...';
            progressFill.style.width = '30%';
            
            try {
                // Step 1: Unregister service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('✅ Unregistered service worker');
                    }
                }
                progressFill.style.width = '50%';
                
                // Step 2: Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (let cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        console.log('✅ Deleted cache:', cacheName);
                    }
                }
                progressFill.style.width = '70%';
                
                // Step 3: Clear localStorage (except important data)
                const keepKeys = ['bvfunguo-organization', 'bvfunguo-user', 'bvfunguo-theme-mode'];
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const key = localStorage.key(i);
                    if (key && !keepKeys.includes(key)) {
                        localStorage.removeItem(key);
                    }
                }
                
                // Step 4: Clear sessionStorage
                sessionStorage.clear();
                progressFill.style.width = '90%';
                
                // Success!
                progressFill.style.width = '100%';
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Cache cleared! Redirecting to app...';
                
                // Mark cache as cleared
                sessionStorage.setItem('bvfunguo-cache-cleared', 'true');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'http://localhost:5174/?fixed=' + Date.now();
                }, 2000);
                
            } catch (error) {
                console.error('Error during cache clear:', error);
                statusDiv.className = 'status working';
                statusDiv.textContent = '⚠️ Partial clear - redirecting anyway...';
                
                setTimeout(() => {
                    window.location.href = 'http://localhost:5174/?fixed=' + Date.now();
                }, 2000);
            }
        }
        
        // Auto-fix on load if requested
        if (window.location.search.includes('auto=1')) {
            setTimeout(() => {
                fixNow();
            }, 1000);
        }
    </script>
</body>
</html>
